<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Synthetic modern Messenger fixture</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font: 15px system-ui; }
#app { display: flex; height: 100vh; } #left-rail { flex: 0 0 260px; overflow-y: auto; padding: 16px; }
#thread { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#thread-header { padding: 18px; border-bottom: 1px solid #ccc; }
#thread-scroll { flex: 1; overflow-y: auto; min-height: 0; padding: 16px; }
.msg-row { display: flex; margin: 8px 0; } .msg-row.out { justify-content: flex-end; }
.msg-wrapper { max-width: 60%; } .msg-bubble { border-radius: 14px; padding: 10px; background: #eee; }
.msg-row.out .msg-bubble { background: #d8e7ff; } .msg-time { display: block; font-size: 11px; }
#composer { padding: 12px; border-top: 1px solid #ccc; } [contenteditable] { min-height: 40px; white-space: pre-wrap; }
</style></head><body><div id="app">
<nav id="left-rail" aria-label="Danh sách trò chuyện"><div>SIDEBAR MUST NOT BE EXTRACTED</div><div>Other conversation preview</div></nav>
<div id="thread">
  <div id="thread-header"><div aria-label="Synthetic test recipient" id="thread-title">Synthetic test recipient</div></div>
  <div id="thread-scroll">
    <div class="msg-row in" data-message-id="modern-1"><div class="msg-wrapper"><div class="msg-bubble"><span dir="auto">Tin nhắn hiện có</span><span class="msg-time" title="10:30">10:30</span></div></div></div>
    <div class="msg-row out" data-message-id="modern-2"><div class="msg-wrapper"><div class="msg-bubble"><span dir="auto">Xin chào 👋</span></div></div></div>
    <div class="msg-row in" data-message-id="modern-3"><div class="msg-wrapper"><div class="msg-bubble"><div dir="auto"><div>dòng một</div><div>dòng hai</div></div><button aria-label="reaction">Thích 2</button></div></div></div>
    <div class="msg-row in" data-message-id="modern-4"><div class="msg-wrapper"><div class="msg-bubble"><span dir="auto">OK</span></div></div></div>
  </div>
  <div id="composer"><div contenteditable="true" role="textbox" aria-label="Nhắn tin" aria-placeholder="Enter để gửi"></div></div>
</div></div></body></html>
